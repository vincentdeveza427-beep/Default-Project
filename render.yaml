services:
  - type: web
    name: science-drills
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Teacher accounts: comma-separated emails that get the admin dashboard (admin.html).
      - key: ADMIN_EMAILS
        sync: false
      # Password-reset email. Use EITHER Brevo (works on Render free) OR Gmail (needs a paid Render plan).
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
