<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>General Science Drill - Set E</title>
<style>
:root{
  --bg1:#071b2e; --bg2:#0d2b45; --accent:#28e0c5; --accent2:#5aa9ff;
  --card:#0f2740; --card-border:#1c3f5e; --text:#eaf6ff; --muted:#9db4c7;
  --correct:#2ecc71; --wrong:#ff5f6d; --amber:#ffcc66;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at 20% 10%, #123456 0%, var(--bg1) 45%, #050f1a 100%);
  color:var(--text); min-height:100vh; padding-bottom:60px;
}
header{
  padding:28px 20px 18px; text-align:center; position:relative; overflow:hidden;
}
header::before{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(2px 2px at 10% 20%, #fff, transparent),
    radial-gradient(2px 2px at 80% 30%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 60% 70%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 30% 80%, #fff, transparent),
    radial-gradient(2px 2px at 90% 85%, #fff, transparent);
  opacity:.25; pointer-events:none;
}
header h1{
  margin:0; font-size:clamp(1.5rem,4vw,2.4rem); letter-spacing:.5px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  position:relative;
}
header p{color:var(--muted); margin:8px 0 0; font-size:.95rem; position:relative;}

.wrap{max-width:900px; margin:0 auto; padding:0 16px;}

.name-card{
  background:var(--card); border:1px solid var(--card-border); border-radius:16px;
  padding:18px 20px; margin:18px 0; display:flex; flex-wrap:wrap; gap:12px; align-items:center;
}
.name-card label{font-weight:600; font-size:.92rem; color:var(--muted);}
.name-card input{
  flex:1; min-width:180px; background:#0a1e33; border:1px solid var(--card-border);
  color:var(--text); border-radius:10px; padding:10px 14px; font-size:.95rem;
}
.name-card input:focus{outline:none; border-color:var(--accent2);}

.controls{
  display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:18px 0 26px;
}
.btn{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#04222f; border:none; padding:11px 22px; border-radius:30px;
  font-weight:700; font-size:.95rem; cursor:pointer; transition:transform .15s, box-shadow .15s;
  box-shadow:0 4px 14px rgba(40,224,197,.25);
}
.btn:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(40,224,197,.4);}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none; box-shadow:none;}
.btn.secondary{
  background:transparent; color:var(--accent); border:1.5px solid var(--accent);
  box-shadow:none;
}
.btn.secondary:hover{background:rgba(40,224,197,.1);}

.progress-bar{
  height:8px; background:#0a2033; border-radius:6px; overflow:hidden; margin:0 0 20px;
  border:1px solid var(--card-border);
}
.progress-fill{
  height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .3s ease;
}
.stat-row{
  display:flex; justify-content:space-between; font-size:.85rem; color:var(--muted); margin-bottom:6px;
}

#score-banner{
  display:none; text-align:center; background:var(--card); border:1px solid var(--card-border);
  border-radius:16px; padding:22px; margin-bottom:24px;
}
#score-banner h2{margin:0 0 6px; font-size:1.6rem;}
#score-banner .big{
  font-size:2.6rem; font-weight:800; background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
#score-banner p{color:var(--muted); margin:6px 0 0;}
#submitStatus{font-size:.85rem; margin-top:10px; min-height:1.2em;}
#submitStatus.ok{color:var(--correct);}
#submitStatus.err{color:var(--wrong);}
#submitStatus.pending{color:var(--amber);}

.question-card{
  background:var(--card); border:1px solid var(--card-border); border-radius:16px;
  padding:20px; margin-bottom:16px; transition:border-color .2s;
  scroll-margin-top:20px;
}
.question-card.correct{border-color:var(--correct); box-shadow:0 0 0 1px rgba(46,204,113,.25) inset;}
.question-card.wrong{border-color:var(--wrong); box-shadow:0 0 0 1px rgba(255,95,109,.25) inset;}

.q-head{
  display:flex; gap:10px; margin-bottom:14px; align-items:flex-start;
}
.q-num{
  flex:none; width:34px; height:34px; border-radius:50%;
  background:rgba(90,169,255,.15); color:var(--accent2);
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size:.85rem; border:1px solid rgba(90,169,255,.4);
}
.q-text{font-size:1rem; line-height:1.5; font-weight:600;}

.options{display:flex; flex-direction:column; gap:8px;}
.option{
  display:flex; align-items:center; gap:10px;
  background:#0a1e33; border:1px solid var(--card-border); border-radius:10px;
  padding:11px 14px; cursor:pointer; font-size:.92rem; transition:background .15s, border-color .15s;
}
.option:hover{border-color:var(--accent2); background:#0c2338;}
.option .letter{
  flex:none; width:24px; height:24px; border-radius:50%; background:#132c45;
  display:flex; align-items:center; justify-content:center; font-size:.75rem; font-weight:700; color:var(--muted);
}
.option.selected{border-color:var(--accent2); background:rgba(90,169,255,.12);}
.option.selected .letter{background:var(--accent2); color:#04222f;}

.option.reveal-correct{border-color:var(--correct); background:rgba(46,204,113,.12);}
.option.reveal-correct .letter{background:var(--correct); color:#04220f;}
.option.reveal-wrong{border-color:var(--wrong); background:rgba(255,95,109,.12);}
.option.reveal-wrong .letter{background:var(--wrong); color:#2a0407;}
.option.disabled{cursor:default; pointer-events:none;}

.answer-note{
  margin-top:12px; font-size:.85rem; padding:9px 12px; border-radius:8px;
  display:none;
}
.answer-note.show{display:block;}
.answer-note.right{color:var(--correct); background:rgba(46,204,113,.08);}
.answer-note.wrong{color:var(--wrong); background:rgba(255,95,109,.08);}
.answer-note.skip{color:var(--amber); background:rgba(255,204,102,.08);}

.notice{
  display:none; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
  background:rgba(40,224,197,.08); border:1px solid rgba(40,224,197,.35); color:var(--text);
  border-radius:12px; padding:10px 14px; margin-bottom:12px; font-size:.88rem;
}
.notice button{
  background:transparent; color:var(--accent); border:1px solid var(--accent); border-radius:8px;
  padding:5px 12px; font-size:.82rem; font-weight:600; cursor:pointer;
}
.question-card.flash{border-color:var(--amber); box-shadow:0 0 0 2px rgba(255,204,102,.35);}

footer{text-align:center; color:var(--muted); font-size:.8rem; padding:20px; opacity:.6;}

@media (max-width:480px){
  .q-text{font-size:.95rem;}
  .option{font-size:.88rem; padding:10px 12px;}
  .btn{padding:10px 16px; font-size:.88rem;}
}
</style>
</head>
<body>

<header>
  <h1>Science Drill</h1>
  <p>150 questions - Earth Science - Physics - Chemistry - Biology - Set E</p>
</header>

<div class="wrap">

  <div class="name-card">
    <label for="studentName">Name / Student ID:</label>
    <input type="text" id="studentName" placeholder="e.g. LAST NAME, FIRST NAME, MIDDLE INITIAL" autocomplete="off">
  </div>

  <div class="notice" id="resumeNotice"><span id="resumeText"></span><button type="button" id="startOverBtn">Start over</button></div>

  <div class="stat-row">
    <span id="answeredCount">0 / 150 answered</span>
    <span id="liveScore">Score: -</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="controls">
    <button class="btn" id="checkBtn">Submit Answers</button>
    <button class="btn secondary" id="revealBtn">Reveal All Answers</button>
    <button class="btn secondary" id="resetBtn">Reset Drill</button>
  </div>

  <div id="score-banner">
    <h2>Drill Complete</h2>
    <div class="big" id="finalScore">0 / 150</div>
    <p id="finalPct">0% correct</p>
    <p id="submitStatus"></p>
  </div>

  <div id="quizContainer"></div>

  <div class="controls" style="margin-top:20px;">
    <button class="btn secondary" id="topBtn">Back to Top</button>
  </div>
</div>

<footer>Science Drill Reviewer - Set E - 150 items</footer>

ed when warm air rises and is replaced by cold air?", ["thunderstorm", "currents", "waves", "pressure"], 0], ["Why does the earth's temperature rise from sunrise to noontime?", ["Horizontal rays of the sun add to the heat during noontime", "Diagonal rays of the sun reach the earth's surface at noontime", "At noontime the sun gets nearer the earth", "At noontime vertical rays of the sun strike the earth's surface"], 3], ["The power rating of an electric motor that draws current of 3A when operated at 120 V is", ["40W", "1000 W", "360W", "400W"], 2], ["The total potential and kinetic energy of an everyday-sized object is", ["external energy", "gravity", "internal energy", "heat energy"], 2], ["An object is undergoing simple harmonic motion with period (π/2) seconds and amplitude A = 0.20 m. At t = 0 the object is at x = 0. How far is the object from the equilibrium position when t = (π/5) seconds?", ["0.118 m", "0.300 m", "0.215 m", "0.150 m"], 0], ["A hypothetical spaceship takes a straight-line path from the Earth to the moon, a distance of about 400,000 km. Suppose it accelerates at 10.0 m/s² for the first 20 minutes of the trip, then travels at constant speed until the last 20 minutes, when it accelerates at -10 m/s², just coming to rest as it reaches the moon. What total time is required for the trip?", ["776 minutes", "676 minutes", "576 minutes", "476 minutes"], 2], ["When the height of an object is changed, the gravitational potential energy ____.", ["decreases", "remains constant", "increases", "depends on the reference point"], 3], ["The effect that we call a mirage has something to do with ____.", ["asphalt seal", "carbon rod", "electrolyte", "zinc container"], 0], ["Stationary points in a standing wave are called ____.", ["nodes", "zero points", "normal nodes", "antinodes"], 0], ["The magnitude of displacement is always", ["less than or equal to the distance travelled", "less than the distance travelled", "greater than the distance travelled", "equal to th  is the speed of light in a clear plastic material for which the index of refraction is 2.00?", ["6.0 x 10⁸ m/s", "1.5 x 10⁸ m/s", "2.0 x 10⁸ m/s", "3.0 x 10⁸ m/s"], 1], ["White light travels through a diamond and is ____.", ["Refracted, which means that each color of light gives a different index of refraction.", "Selectively refracted, which means that each color of light gives a different index of refraction.", "Dispersed, which means that each color of light gives the same index of refraction.", "Dispersed, which means that each color of light gives a different index of refraction."], 3]];

const letters = ['A','B','C','D'];
const container = document.getElementById('quizContainer');
const nameInput = document.getElementById('studentName');
let userAnswers = new Array(QUESTIONS.length).fill(null);
let checked = false;
let submitted = false;

// ---------- Save progress (stored in this browser only) ----------
const STORAGE_KEY = 'sciDrillProgress_E';
function saveProgress(){
  if(checked) return;
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      answers: userAnswers, name: nameInput.value, saved: Date.now()
    }));
  }catch(e){}
}
function clearProgress(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
}
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || !Array.isArray(d.answers) || d.answers.length !== QUESTIONS.length) return false;
    const valid = d.answers.every(function(a){ return a === null || (Number.isInteger(a) && a >= 0 && a < 4); });
    if(!valid) return false;
    userAnswers = d.answers;
    if(typeof d.name === 'string') nameInput.value = d.name;
    return userAnswers.some(function(a){ return a !== null; });
  }catch(e){ return false; }
}

function render(range){
  container.innerHTML = '';
  const start = range[0], end = range[1];
  for(let i=start;i<end;i++){
    const qtext = QUESTIONS[i][0], opts = QUESTIONS[i][1], correctIdx = QUESTIONS[i][2];
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'q'+i;

    const head = document.createElement('div');
    head.className = 'q-head';
    head.innerHTML = '<div class="q-num">'+(i+1)+'</div><div class="q-text">'+qtext+'</div>';
    card.appendChild(head);

    const optsWrap = document.createElement('div');
    optsWrap.className = 'options';
    opts.forEach(function(optText, idx){
      const opt = document.createElement('div');
      opt.className = 'option';
      opt.dataset.idx = idx;
      if(userAnswers[i] === idx) opt.classList.add('selected');
      opt.innerHTML = '<div class="letter">'+letters[idx]+'</div><div>'+optText+'</div>';
      opt.addEventListener('click', function(){
        if(checked) return;
        userAnswers[i] = idx;
        Array.prototype.forEach.call(optsWrap.children, function(c){c.classList.remove('selected');});
        opt.classList.add('selected');
        updateStats();
        saveProgress();
      });
      optsWrap.appendChild(opt);
    });
    card.appendChild(optsWrap);

    const note = document.createElement('div');
    note.className = 'answer-note';
    note.id = 'note'+i;
    card.appendChild(note);

    container.appendChild(card);
  }
  updateStats();
}

function updateStats(){
  const answered = userAnswers.filter(function(a){return a!==null;}).length;
  document.getElementById('answeredCount').textContent = answered + ' / ' + QUESTIONS.length + ' answered';
  document.getElementById('progressFill').style.width = (answered/QUESTIONS.length*100)+'%';
  if(!checked){
    document.getElementById('liveScore').textContent = 'Score: -';
  }
}

function checkAnswers(){
  const name = nameInput.value.trim();
  if(!name){
    nameInput.focus();
    nameInput.style.borderColor = 'var(--wrong)';
    setTimeout(function(){ nameInput.style.borderColor = ''; }, 1500);
    alert('Please enter your name / student ID before submitting.');
    return;
  }
  if(submitted){
    return; // prevent double submission
  }

  // Unanswered warning (counts only the questions currently shown)
  const shown = getRange();
  let firstUnanswered = -1, unanswered = 0;
  for(let i = shown[0]; i < shown[1]; i++){
    if(userAnswers[i] === null){
      unanswered++;
      if(firstUnanswered === -1) firstUnanswered = i;
    }
  }
  if(unanswered > 0){
    const msg = 'You have ' + unanswered + ' unanswered question' + (unanswered === 1 ? '' : 's') +
                '. Unanswered items will be marked wrong.\n\nSubmit anyway?';
    if(!confirm(msg)){
      const target = document.getElementById('q' + firstUnanswered);
      if(target){
        target.scrollIntoView({behavior:'smooth', block:'center'});
        target.classList.add('flash');
        setTimeout(function(){ target.classList.remove('flash'); }, 2500);
      }
      return;
    }
  }

  checked = true;
  let score = 0;
  QUESTIONS.forEach(function(q, i){
    const opts = q[1], correctIdx = q[2];
    const card = document.getElementById('q'+i);
    if(!card) return;
    const optsEls = card.querySelectorAll('.option');
    const userIdx = userAnswers[i];
    optsEls.forEach(function(el){el.classList.add('disabled');});
    const note = document.getElementById('note'+i);
    note.classList.add('show');

    if(userIdx === correctIdx){
      score++;
      card.classList.add('correct');
      optsEls[correctIdx].classList.add('reveal-correct');
      note.className = 'answer-note show right';
      note.textContent = 'Correct - Answer: ' + letters[correctIdx] + '. ' + opts[correctIdx];
    } else if(userIdx === null){
      card.classList.add('wrong');
      optsEls[correctIdx].classList.add('reveal-correct');
      note.className = 'answer-note show skip';
      note.textContent = 'Not answered - Correct answer: ' + letters[correctIdx] + '. ' + opts[correctIdx];
    } else {
      card.classList.add('wrong');
      optsEls[correctIdx].classList.add('reveal-correct');
      optsEls[userIdx].classList.add('reveal-wrong');
      note.className = 'answer-note show wrong';
      note.textContent = 'Incorrect - Correct answer: ' + letters[correctIdx] + '. ' + opts[correctIdx];
    }
  });

  document.getElementById('liveScore').textContent = 'Score: ' + score + ' / ' + QUESTIONS.length;

  const banner = document.getElementById('score-banner');
  banner.style.display = 'block';
  document.getElementById('finalScore').textContent = score + ' / ' + QUESTIONS.length;
  document.getElementById('finalPct').textContent = Math.round(score/QUESTIONS.length*100) + '% correct';
  banner.scrollIntoView({behavior:'smooth', block:'start'});

  submitScore(name, score, QUESTIONS.length);
}

function submitScore(name, score, total){
  const statusEl = document.getElementById('submitStatus');

  if(!SUBMIT_URL){
    statusEl.className = 'err';
    statusEl.textContent = 'Submission is not set up yet (ask your teacher).';
    return;
  }

  statusEl.className = 'pending';
  statusEl.textContent = 'Submitting...';

  const payload = new URLSearchParams();
  payload.append('set', 'E');
  payload.append('name', name);
  payload.append('score', score);
  payload.append('total', total);
  payload.append('percent', Math.round(score/total*100));
  payload.append('section', '0-150');
  payload.append('timestamp', new Date().toISOString());

  fetch(SUBMIT_URL, {
    method: 'POST',
    mode: 'no-cors', // Apps Script web apps don't return CORS headers by default
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: payload.toString()
  }).then(function(){
    // no-cors gives an opaque response, so we can't confirm success from the response itself,
    // but a network-level failure will still throw and land in .catch()
    submitted = true;
    clearProgress();
    statusEl.className = 'ok';
    statusEl.textContent = 'Submitted! Your teacher can now see your result.';
  }).catch(function(err){
    statusEl.className = 'err';
    statusEl.textContent = 'Could not submit (check your internet connection) — your score is still shown above.';
  });
}

function revealAll(){
  checked = true;
  QUESTIONS.forEach(function(q,i){
    const opts = q[1], correctIdx = q[2];
    const card = document.getElementById('q'+i);
    if(!card) return;
    const optsEls = card.querySelectorAll('.option');
    optsEls.forEach(function(el){el.classList.add('disabled');});
    optsEls[correctIdx].classList.add('reveal-correct');
    const note = document.getElementById('note'+i);
    note.className = 'answer-note show right';
    note.textContent = 'Answer: ' + letters[correctIdx] + '. ' + opts[correctIdx];
  });
}

function resetDrill(){
  if(!checked && userAnswers.some(function(a){ return a !== null; })){
    if(!confirm('Reset the drill? Your saved answers will be erased.')) return;
  }
  clearProgress();
  document.getElementById('resumeNotice').style.display = 'none';
  checked = false;
  submitted = false;
  userAnswers = new Array(QUESTIONS.length).fill(null);
  document.getElementById('score-banner').style.display = 'none';
  document.getElementById('submitStatus').textContent = '';
  render(getRange());
  window.scrollTo({top:0, behavior:'smooth'});
}

function getRange(){
  return [0, QUESTIONS.length];
}

document.getElementById('checkBtn').addEventListener('click', checkAnswers);
document.getElementById('revealBtn').addEventListener('click', revealAll);
document.getElementById('resetBtn').addEventListener('click', resetDrill);
document.getElementById('topBtn').addEventListener('click', function(){window.scrollTo({top:0,behavior:'smooth'});});
nameInput.addEventListener('input', saveProgress);
document.getElementById('startOverBtn').addEventListener('click', resetDrill);

if(loadProgress()){
  const n = userAnswers.filter(function(a){ return a !== null; }).length;
  document.getElementById('resumeText').textContent = 'Welcome back! Your saved progress was restored (' + n + ' answered).';
  document.getElementById('resumeNotice').style.display = 'flex';
}
render(getRange());
</script>
</body>
</html>
