<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Drills</title>
<link rel="stylesheet" href="theme.css">
<script src="intro.js"></script>
<style>
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin:26px 0 8px}
.welcome h1{font-size:clamp(1.8rem,4.5vw,2.6rem);line-height:1.15;margin:6px 0 10px}
.welcome h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{color:var(--muted);margin:0 0 18px;max-width:520px}
.feat{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.next{margin-top:14px;display:flex;align-items:center;gap:12px;background:#0c1a30;border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:.85rem}
.next .ic{font-size:1.5rem}
.next .bar{height:6px;background:#0a1830;border-radius:99px;overflow:hidden;margin-top:5px}
.next .bar i{display:block;height:100%;background:var(--amber);border-radius:99px}
.quests h3{font-size:1rem;display:flex;justify-content:space-between;align-items:center}
.quest{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.quest:first-of-type{border-top:0}
.quest .chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:900;color:transparent}
.quest.done .chk{background:var(--good);border-color:var(--good);color:#04220f}
.quest .qt{flex:1;font-size:.88rem;font-weight:600}
.quest .qb{height:5px;background:#0a1830;border-radius:99px;overflow:hidden;margin-top:5px}
.quest .qb i{display:block;height:100%;background:var(--accent2)}
.quest.done .qb i{background:var(--good)}
.quest small{color:var(--muted);font-weight:600}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:30px 0 14px}
.sechead h2{font-size:1.3rem}
.modeinfo{color:var(--muted);font-size:.85rem;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.set{display:flex;flex-direction:column;gap:12px;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:transform .18s,border-color .18s,box-shadow .18s}
.set:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 14px 34px rgba(0,0,0,.35)}
.set .top{display:flex;gap:14px;align-items:center}
.set .letter{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:1.4rem;color:#04222f;background:var(--c)}
.set h3{font-size:1.05rem}
.set p{margin:2px 0 0;color:var(--muted);font-size:.8rem;line-height:1.4}
.meter{font-size:.74rem;color:var(--muted)}
.meter .row{display:flex;justify-content:space-between;margin-bottom:4px;font-weight:600}
.meter .bar{height:6px;background:#0a1830;border-radius:99px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.set .go{margin-top:auto;font-weight:800;font-size:.86rem;color:var(--c)}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.bdg{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;background:var(--surface);border:1px solid var(--line)}
.bdg.off{filter:grayscale(1);opacity:.28}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:40px 0}

/* leaderboard preview */
.lb{margin-top:16px}
.lb .head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.lb h3{font-size:1rem}
.lb .seg button{padding:6px 12px;font-size:.8rem}
.lbrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.lbrow:first-child{border-top:0}
.lbrow .rk{flex:none;width:30px;text-align:center;font-weight:900;color:var(--muted)}
.lbrow .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow .xp{font-weight:900;color:var(--accent);white-space:nowrap}
.lbrow.you{background:rgba(90,169,255,.08);border-radius:10px;padding-left:8px;padding-right:8px}
.lb-empty{color:var(--muted);font-size:.88rem;text-align:center;padding:18px 8px;line-height:1.6}
.lb-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:.82rem;color:var(--muted)}

@media(max-width:860px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="nav"><div class="container in">
  <a class="brand" href="index.html"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#04222f" stroke-width="2"><circle cx="12" cy="12" r="2" fill="#04222f"/><ellipse cx="12" cy="12" rx="9" ry="3.6"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(120 12 12)"/></svg></span>Science Drills</a>
  <nav class="links"><a class="on" href="index.html">Home</a><a href="progress.html">Dashboard</a><a href="leaderboard.html">Leaderboard</a></nav>
  <div class="right" id="topbar">
    <button class="btn ghost sm" id="loginBtn">Log in</button>
    <button class="btn sm" id="signupBtn">Sign up</button>
  </div>
</div></header>

<main class="container">
  <section class="hero">
    <div class="card welcome" id="heroMain"></div>
    <div class="card quests" id="questCard"></div>
  </section>

  <section class="card lb">
    <div class="head">
      <h3>🏆 Leaderboard</h3>
      <div class="seg" id="lbSeg"><button data-p="day" class="on">Today</button><button data-p="week">This week</button></div>
    </div>
    <div id="lbBody"><div class="lb-empty">Loading...</div></div>
    <div class="lb-foot"><span id="lbMe"></span><a href="leaderboard.html">View full leaderboard →</a></div>
  </section>

  <div class="sechead">
    <div><h2>Choose a drill set</h2><div class="modeinfo" id="modeInfo"></div></div>
    <div class="seg" id="seg"><button data-mode="timed">⏱ Timed exam</button><button data-mode="flashcards">🃏 Flashcards</button><button data-mode="practice">✍️ Practice</button></div>
  </div>
  <div class="grid" id="setGrid"></div>

  <div class="sechead"><div><h2>Achievements</h2><div class="modeinfo" id="badgeInfo"></div></div><a class="btn ghost sm" href="progress.html">Open dashboard →</a></div>
  <div class="badges" id="badges"></div>
</main>
<footer>Science Drill Reviewer</footer>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Sign up</h3>
    <p id="modalSub">Create an account to track your drills.</p>
    <input id="nameField" placeholder="Username" autocomplete="username" />
    <input id="emailField" type="email" placeholder="Email" autocomplete="email" />
    <input id="codeField" placeholder="6-digit code from your email" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
    <input id="passField" type="password" placeholder="Password (min 6 chars)" />
    <button class="link" id="forgotLink" type="button">Forgot password?</button>
    <button class="link" id="backLink" type="button">&larr; Back to log in</button>
    <div class="err" id="authErr"></div>
    <div class="ok" id="authOk"></div>
    <div class="row"><button class="btn ghost" id="cancelBtn">Cancel</button><button class="btn" id="submitBtn">Sign up</button></div>
  </div>
</div>

<script src="game.js"></script>
<script>
const SETS = [
  { title: "Set A", description: "Earth Science, Astronomy, and Physics.", href: "science-drill-1.html" },
  { title: "Set B", description: "Physics, Chemistry, and Biology.", href: "science-drill-2.html" },
  { title: "Set C", description: "Biology, Earth Science, Astronomy, Physics, and Chemistry.", href: "science-drill-3.html" },
  { title: "Set D", description: "Biology, Earth Science, and Physics.", href: "science-drill-4.html" },
  { title: "Set E", description: "Earth Science, Physics, Chemistry, and Biology.", href: "science-drill-5.html" },
  { title: "Set F", description: "Physics and Chemistry.", href: "science-drill-6.html" }
];
const MODES = {
  timed: { page: 'timed.html', cta: 'Start timed exam →', info: '3 hours on the clock. Earn 5 XP per correct answer plus a bonus for 60%+ scores.' },
  practice: { direct: true, cta: 'Start practice →', info: 'Self-paced with no timer. Saved to your account, optional shuffling, instant feedback. Practice does not earn XP.' },
  flashcards: { page: 'flashcards.html', cta: 'Study flashcards →', info: 'Spaced repetition at your own pace. Earn 2 XP per review and 10 XP per card learned.' }
};
const $ = id => document.getElementById(id);
let mode = 'timed', stats = null, user = null;
const fmt = n => Math.round(n).toLocaleString();

/* ---------- rendering ---------- */
function renderHero() {
  const hero = $('heroMain'), qc = $('questCard');
  if (!stats) {
    hero.innerHTML = '<div class="eyebrow">General science review</div><h1>Study smarter. <span>Level up.</span></h1>' +
      '<p>Practice timed exams or spaced-repetition flashcards. Log in to earn XP, unlock achievements and see detailed analytics of how you improve.</p>' +
      '<button class="btn" id="heroSignup">Create free account</button> <button class="btn ghost" id="heroLogin">I have an account</button>' +
      '<div class="feat"><span class="pill">✨ XP &amp; levels</span><span class="pill">🏅 25 achievements</span><span class="pill">📊 Progress charts</span><span class="pill">🔥 Daily streaks</span></div>';
    $('heroSignup').onclick = () => openModal('signup'); $('heroLogin').onclick = () => openModal('login');
    qc.innerHTML = '<h3>Daily goals</h3><p class="sub">Log in to track daily goals and keep your streak alive.</p>' +
      ['🃏 Review 20 flashcards', '⏱️ Finish a timed exam', '🎯 Score 75%+ on an exam'].map(t => '<div class="quest"><div class="chk">✓</div><div class="qt">' + t + '</div></div>').join('');
    return;
  }
  const l = stats.lvl;
  hero.innerHTML = '<div class="player"><div class="avatar" style="--p:' + l.pct.toFixed(1) + '"><div><small>LEVEL</small><b>' + l.level + '</b></div></div>' +
    '<div class="pinfo"><div class="pname" id="pn"></div><div class="prank">' + l.title + '</div><div class="xpbar"><i style="width:' + l.pct.toFixed(1) + '%"></i></div>' +
    '<div class="xpmeta"><span>' + fmt(l.into) + ' / ' + fmt(l.need) + ' XP to level ' + (l.level + 1) + '</span><span>' + fmt(stats.xp) + ' XP total</span></div></div></div>' +
    '<div class="pstats"><span class="pill">🔥 ' + stats.streak + '<em>day streak</em></span><span class="pill">🏅 ' + stats.unlocked + '/' + stats.achievements.length + '<em>badges</em></span>' +
    '<span class="pill">📝 ' + stats.examCount + '<em>exams</em></span><span class="pill">🃏 ' + stats.learned + '<em>cards learned</em></span></div>' +
    (stats.nextUp ? '<div class="next"><span class="ic">' + stats.nextUp.icon + '</span><div style="flex:1"><b>Next badge: ' + stats.nextUp.name + '</b><div class="meter"><div class="bar"><i style="width:' + (stats.nextUp.ratio * 100).toFixed(0) + '%"></i></div></div></div><span style="color:var(--muted);font-weight:700">' + Math.floor(stats.nextUp.cur) + stats.nextUp.unit + ' / ' + stats.nextUp.goal + stats.nextUp.unit + '</span></div>' : '');
  $('pn').textContent = user ? (user.name || user.email) : '';
  const done = stats.quests.filter(q => q.done).length;
  qc.innerHTML = '<h3>Daily goals <small style="color:var(--muted);font-weight:700">' + done + '/' + stats.quests.length + '</small></h3><p class="sub">Resets every day. Keep your streak going.</p>' +
    stats.quests.map(q => '<div class="quest ' + (q.done ? 'done' : '') + '"><div class="chk">✓</div><div class="qt">' + q.icon + ' ' + q.label +
      '<div class="qb"><i style="width:' + (q.ratio * 100).toFixed(0) + '%"></i></div></div><small>' + Math.min(q.cur, q.goal) + (q.unit || '') + '/' + q.goal + (q.unit || '') + '</small></div>').join('');
}

function renderSets() {
  const m = MODES[mode];
  $('modeInfo').textContent = m.info;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  $('setGrid').innerHTML = SETS.map((s, i) => {
    const L = String.fromCharCode(65 + i), c = SD.COLORS[L], ps = stats && stats.perSet[L];
    let meter = '<div class="meter"><div class="row"><span>150 questions</span><span>Log in to track mastery</span></div></div>';
    if (ps) {
      meter = mode === 'practice' ? '<div class="meter"><div class="row"><span>Self-paced practice</span><span>Saved to your account</span></div></div>' : mode === 'flashcards'
        ? '<div class="meter"><div class="row"><span>Mastery</span><span>' + ps.learned + ' / 150 learned</span></div><div class="bar"><i style="width:' + (ps.learned / 150 * 100).toFixed(0) + '%"></i></div></div>'
        : '<div class="meter"><div class="row"><span>Best exam score</span><span>' + (ps.attempts ? Math.round(ps.best) + '% · ' + ps.attempts + ' attempt' + (ps.attempts > 1 ? 's' : '') : 'Not attempted')
          + '</span></div><div class="bar"><i style="width:' + Math.round(ps.best) + '%"></i></div></div>';
    }
    return '<a class="set" style="--c:' + c + '" href="' + (m.direct ? s.href + '?mode=practice' : m.page + '?set=' + encodeURIComponent(s.href)) + '"><div class="top"><div class="letter">' + L + '</div><div><h3>' + s.title + '</h3><p>' + s.description + '</p></div></div>' + meter + '<div class="go">' + m.cta + '</div></a>';
  }).join('');
}

function renderBadges() {
  if (!stats) { $('badgeInfo').textContent = 'Log in to start unlocking badges.'; $('badges').innerHTML = SD.ACHIEVEMENTS.slice(0, 12).map(a => '<div class="bdg off" title="' + a.name + '">' + a.icon + '</div>').join(''); return; }
  $('badgeInfo').textContent = stats.unlocked + ' of ' + stats.achievements.length + ' unlocked';
  const sorted = stats.achievements.slice().sort((a, b) => (b.done - a.done) || (b.ratio - a.ratio));
  $('badges').innerHTML = sorted.slice(0, 14).map(a => '<div class="bdg ' + (a.done ? '' : 'off') + '" title="' + a.name + ': ' + a.desc + '">' + a.icon + '</div>').join('');
}
function renderAll() { renderHero(); renderSets(); renderBadges(); }

/* ---------- leaderboard preview (top 5) ---------- */
let lbPeriod = 'day', lbReq = 0;
function lbMsg(t) { $('lbBody').innerHTML = '<div class="lb-empty">' + t + '</div>'; $('lbMe').textContent = ''; }
async function loadBoard() {
  if (!SD.token()) { lbMsg('Log in to see the top students ' + (lbPeriod === 'day' ? 'today' : 'this week') + '.'); return; }
  const req = ++lbReq;
  try {
    const r = await fetch('/api/leaderboard?period=' + lbPeriod + '&today=' + encodeURIComponent(SD.today()), { headers: { Authorization: 'Bearer ' + SD.token() } });
    if (req !== lbReq) return;                       // a newer click superseded this request
    if (r.status === 401) { lbMsg('Log in to see the top students.'); return; }
    if (!r.ok) throw new Error('http ' + r.status);
    const d = await r.json();
    if (req === lbReq) renderBoard(d);
  } catch { if (req === lbReq) lbMsg('Could not load the leaderboard.'); }
}
function renderBoard(d) {
  const label = d.period === 'day' ? 'today' : 'this week';
  const medal = r => r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : '#' + r;
  const top = d.entries.slice(0, 5);
  $('lbBody').innerHTML = top.length
    ? top.map(e => '<div class="lbrow' + (e.you ? ' you' : '') + '"><div class="rk">' + medal(e.rank) + '</div>' + SD.avatarHtml(e.avatar, e.name, 34) +
        '<div class="nm">' + SD.esc(e.name) + (e.you ? ' (you)' : '') + '</div><div class="xp">' + fmt(e.xp) + ' XP</div></div>').join('')
    : '<div class="lb-empty">Nobody has earned XP ' + label + ' yet. Be the first!</div>';
  const me = d.me;
  $('lbMe').textContent = me.admin ? 'Teacher accounts are not ranked.'
    : me.hidden ? 'You are hidden from the board.'
    : me.rank ? 'You are #' + me.rank + ' ' + label + ' (' + fmt(me.xp) + ' XP)'
    : 'Earn XP ' + label + ' to join the board.';
}
document.querySelectorAll('#lbSeg button').forEach(b => b.onclick = () => {
  lbPeriod = b.dataset.p;
  document.querySelectorAll('#lbSeg button').forEach(x => x.classList.toggle('on', x === b));
  loadBoard();
});
setInterval(() => { if (document.visibilityState === 'visible') loadBoard(); }, 60000);

/* ---------- mode toggle (kept in the URL hash) ---------- */
function syncFromHash() { const h = location.hash.replace('#', ''); mode = MODES[h] ? h : mode; renderSets(); }
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => { mode = b.dataset.mode; history.replaceState(null, '', '#' + mode); renderSets(); });
window.addEventListener('hashchange', syncFromHash);

/* ---------- auth (talks to server.js) ---------- */
let amode = 'signup';
const modalBg = $('modalBg'), submitBtn = $('submitBtn'), authErr = $('authErr'), authOk = $('authOk');
const MODE_TEXT = {
  signup: ['Sign up', 'Create an account to earn XP and track your progress.', 'Sign up'],
  login: ['Log in', 'Welcome back.', 'Log in'],
  forgot: ['Forgot password', 'Enter your account email and we will send you a 6-digit code.', 'Send code'],
  reset: ['Reset password', 'Enter the code we emailed you and choose a new password.', 'Reset password']
};
function openModal(m, notice) {
  amode = m; const t = MODE_TEXT[m];
  $('modalTitle').textContent = t[0]; $('modalSub').textContent = t[1]; submitBtn.textContent = t[2];
  $('nameField').classList.toggle('hidden', m !== 'signup');
  $('codeField').classList.toggle('hidden', m !== 'reset');
  $('passField').classList.toggle('hidden', m === 'forgot');
  $('passField').placeholder = m === 'reset' ? 'New password (min 6 chars)' : 'Password (min 6 chars)';
  $('passField').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  $('forgotLink').classList.toggle('hidden', m !== 'login');
  $('backLink').classList.toggle('hidden', m !== 'forgot' && m !== 'reset');
  $('passField').value = ''; $('codeField').value = '';
  authErr.textContent = ''; authOk.textContent = notice || '';
  modalBg.classList.add('open');
}
$('signupBtn').onclick = () => openModal('signup');
$('loginBtn').onclick = () => openModal('login');
$('forgotLink').onclick = () => openModal('forgot');
$('backLink').onclick = () => openModal('login');
$('cancelBtn').onclick = () => modalBg.classList.remove('open');
modalBg.addEventListener('click', e => { if (e.target === modalBg) modalBg.classList.remove('open'); });

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  let data = {}; try { data = await r.json(); } catch {}
  return { ok: r.ok, data };
}
submitBtn.onclick = async () => {
  authErr.textContent = ''; authOk.textContent = '';
  const email = $('emailField').value.trim();
  submitBtn.disabled = true;
  try {
    if (amode === 'signup' || amode === 'login') {
      const { ok, data } = await post('/api/' + amode, { name: $('nameField').value, email, password: $('passField').value });
      if (!ok) { authErr.textContent = data.error || 'Something went wrong.'; return; }
      localStorage.setItem('sd_token', data.token);
      modalBg.classList.remove('open');
      boot(data.user);
    } else if (amode === 'forgot') {
      const { ok, data } = await post('/api/forgot', { email });
      if (!ok) { authErr.textContent = data.error || 'Something went wrong.'; return; }
      openModal('reset', data.message + ' Check your spam folder too.');
    } else if (amode === 'reset') {
      const { ok, data } = await post('/api/reset', { email, code: $('codeField').value.trim(), password: $('passField').value });
      if (!ok) { authErr.textContent = data.error || 'Something went wrong.'; return; }
      openModal('login', data.message);
    }
  } catch { authErr.textContent = 'Cannot reach the server. Please try again.'; }
  finally { submitBtn.disabled = false; }
};

let navAv = null;
async function loadNavAvatar() {
  try {
    if (!navAv) { const r = await fetch('/api/profile', { headers: { Authorization: 'Bearer ' + SD.token() } }); if (!r.ok) return; navAv = await r.json(); }
    const el = $('navAv');
    if (el) el.innerHTML = SD.avatarHtml(navAv.avatar, user && user.name, 24);
  } catch {}
}
function renderNav() {
  const tb = $('topbar');
  tb.innerHTML = (user.role === 'admin' ? '<a class="btn ghost sm" href="admin.html">Teacher</a>' : '') + '<a class="lvlchip" href="progress.html"><b id="navLvl">1</b><span id="navAv"></span><span class="nm" id="navName"></span></a><button class="btn ghost sm" id="logoutBtn">Log out</button>';
  $('navName').textContent = user.name || user.email;          // textContent: safe against HTML in usernames
  $('navLvl').textContent = stats ? stats.lvl.level : '1';
  loadNavAvatar();
  $('logoutBtn').onclick = () => { localStorage.removeItem('sd_token'); location.reload(); };
}
async function boot(u) {
  user = u; stats = null; renderNav(); renderAll(); loadBoard();
  stats = await SD.check();
  renderNav(); renderAll(); loadBoard();
}

(async () => {
  syncFromHash(); renderAll(); loadBoard();
  if (!SD.token()) return;
  try {
    const r = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + SD.token() } });
    if (!r.ok) return;
    boot(await r.json());
  } catch {}
})();
</script>
</body>
</html>
