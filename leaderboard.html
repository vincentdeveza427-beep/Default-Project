<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard - Science Drills</title>
<link rel="stylesheet" href="theme.css">
<style>
.msg{margin-top:40px;text-align:center;color:var(--muted);line-height:1.8;padding:40px}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0 6px}
.pagehead h2{font-size:1.3rem}
.period{color:var(--muted);font-size:.85rem;margin:0 0 16px}
.me{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.me .big{font-size:1.6rem;font-weight:900;line-height:1.1}
.me .sub{margin:2px 0 0}
.me .sp{flex:1}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:12px;margin-bottom:16px;align-items:end}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pod.first{border-color:var(--amber);padding-top:26px;box-shadow:0 0 40px rgba(255,200,87,.12)}
.pod .medal{font-size:1.7rem;line-height:1}
.pod .nm{font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .xp{color:var(--accent);font-weight:900}
.pod .meta{color:var(--muted);font-size:.74rem}
.you{border-color:var(--accent2)!important;background:rgba(90,169,255,.08)!important}
.rows{padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .rk{flex:none;width:34px;text-align:center;font-weight:900;color:var(--muted)}
.row .who{flex:1;min-width:0}
.row .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{color:var(--muted);font-size:.74rem}
.row .xp{font-weight:900;color:var(--accent);white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:36px 16px;line-height:1.7}
.foot{color:var(--muted);font-size:.76rem;margin:14px 0 40px;text-align:center}
@media(max-width:560px){.pod{padding:12px 6px}.pod .meta{display:none}}
</style>
</head>
<body>
<header class="nav"><div class="container in">
  <a class="brand" href="index.html"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#04222f" stroke-width="2"><circle cx="12" cy="12" r="2" fill="#04222f"/><ellipse cx="12" cy="12" rx="9" ry="3.6"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(120 12 12)"/></svg></span>Science Drills</a>
  <nav class="links"><a href="index.html">Home</a><a href="progress.html">Dashboard</a><a class="on" href="leaderboard.html">Leaderboard</a></nav>
  <div class="right"><a class="btn ghost sm" href="profile.html">Edit profile</a></div>
</div></header>

<main class="container">
  <div id="msg" class="card msg">Loading...</div>
  <div id="main" class="hidden">
    <div class="pagehead">
      <h2>Leaderboard</h2>
      <div class="seg" id="seg"><button data-p="day" class="on">Today</button><button data-p="week">This week</button></div>
    </div>
    <p class="period" id="period"></p>
    <div class="card me" id="me"></div>
    <div class="podium" id="podium"></div>
    <div class="card rows" id="rows"></div>
    <p class="foot">Ranked by XP from timed exams and flashcards. Practice mode and badge bonuses are not counted. Teacher accounts are not ranked.</p>
  </div>
</main>

<script src="game.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var period = 'day', busy = false;
  function msg(t) { $('msg').classList.remove('hidden'); $('main').classList.add('hidden'); $('msg').innerHTML = t; }
  function fmtDate(s) { return new Date(s + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }); }
  function n(x) { return Math.round(x).toLocaleString(); }
  function meta(e) {
    var p = [];
    if (e.exams) p.push(e.exams + ' exam' + (e.exams === 1 ? '' : 's'));
    if (e.reviews) p.push(e.reviews + ' review' + (e.reviews === 1 ? '' : 's'));
    return p.join(' · ');
  }

  if (!SD.token()) { msg('Please log in on the <a href="index.html">home page</a> to see the leaderboard.'); return; }

  function load() {
    if (busy) return; busy = true;
    fetch('/api/leaderboard?period=' + period + '&today=' + encodeURIComponent(SD.today()), { headers: { Authorization: 'Bearer ' + SD.token() } })
      .then(function (r) {
        if (r.status === 401) { try { localStorage.removeItem('sd_token'); } catch (e) {} msg('Your session expired. Please log in again on the <a href="index.html">home page</a>.'); return null; }
        if (!r.ok) throw new Error('http ' + r.status);
        return r.json();
      })
      .then(function (d) { busy = false; if (d) render(d); })
      .catch(function () { busy = false; if ($('main').classList.contains('hidden')) msg('Could not load the leaderboard. Make sure the server is running and try again.'); });
  }

  function render(d) {
    $('msg').classList.add('hidden'); $('main').classList.remove('hidden');
    Array.prototype.forEach.call($('seg').children, function (b) { b.classList.toggle('on', b.getAttribute('data-p') === d.period); });
    $('period').textContent = d.period === 'day'
      ? 'Today, ' + fmtDate(d.from) + '. Resets at midnight.'
      : fmtDate(d.from) + ' to ' + fmtDate(d.to) + '. Resets every Monday.';

    // your standing
    var me = d.me, label = d.period === 'day' ? 'today' : 'this week', h;
    if (me.admin) h = '<div><div class="big">Teacher account</div><p class="sub">Teachers are not ranked.</p></div>';
    else if (me.hidden) h = '<div><div class="big">You are hidden</div><p class="sub">Your ' + label + ' XP: ' + n(me.xp) + '. Others cannot see you on the board.</p></div><span class="sp"></span><a class="btn ghost sm" href="profile.html">Change</a>';
    else if (me.rank) h = '<div><div class="big">You are #' + me.rank + '</div><p class="sub">' + n(me.xp) + ' XP ' + label + ' · ' + d.total + ' ranked</p></div>';
    else h = '<div><div class="big">Not ranked yet</div><p class="sub">Earn XP ' + label + ' with a timed exam or flashcard reviews to join the board.</p></div><span class="sp"></span><a class="btn sm" href="index.html">Study now</a>';
    $('me').innerHTML = h;

    var es = d.entries;
    if (!es.length) {
      $('podium').innerHTML = '';
      $('rows').innerHTML = '<div class="empty">Nobody has earned XP ' + label + ' yet.<br>Finish a timed exam or review flashcards to take the first spot!</div>';
      return;
    }
    var medal = function (r) { return r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : '#' + r; };
    var top = es.slice(0, 3), order = top.length === 3 ? [1, 0, 2] : top.length === 2 ? [1, 0] : [0];
    $('podium').innerHTML = order.map(function (i) {
      var e = top[i];
      return '<div class="pod' + (e.rank === 1 ? ' first' : '') + (e.you ? ' you' : '') + '"><div class="medal">' + medal(e.rank) + '</div>' +
        SD.avatarHtml(e.avatar, e.name, e.rank === 1 ? 64 : 52) +
        '<div class="nm" title="' + SD.esc(e.name) + '">' + SD.esc(e.name) + (e.you ? ' (you)' : '') + '</div>' +
        '<div class="xp">' + n(e.xp) + ' XP</div><div class="meta">' + SD.esc(meta(e)) + '</div></div>';
    }).join('');

    var rest = es.slice(3);
    $('rows').classList.toggle('hidden', !rest.length);
    $('rows').innerHTML = rest.map(function (e) {
      return '<div class="row' + (e.you ? ' you' : '') + '"><div class="rk">' + e.rank + '</div>' + SD.avatarHtml(e.avatar, e.name, 38) +
        '<div class="who"><div class="nm">' + SD.esc(e.name) + (e.you ? ' (you)' : '') + '</div><div class="meta">' + SD.esc(meta(e)) + '</div></div>' +
        '<div class="xp">' + n(e.xp) + ' XP</div></div>';
    }).join('');
  }

  $('seg').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    period = b.getAttribute('data-p'); busy = false; load();
  };
  setInterval(function () { if (document.visibilityState === 'visible') load(); }, 60000);
  load();
})();
</script>
</body>
</html>
